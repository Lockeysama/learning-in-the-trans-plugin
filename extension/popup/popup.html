<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Littp</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <div>
          <h1>Littp</h1>
          <p class="sub">刚够看懂的英文阅读视图</p>
        </div>
        <button type="button" id="openSettings" class="icon-btn" aria-label="翻译器设置" title="翻译器设置">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.6.24-1.15.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.1a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.69.22l2.39-.96c.48.39 1.03.7 1.63.94l.36 2.54c.05.24.26.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.6-.24 1.15-.55 1.63-.94l2.39.96c.26.12.55.02.69-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
          </svg>
        </button>
      </header>
      <div class="switch" role="radiogroup" aria-label="阅读视图">
        <button type="button" id="original" class="switch-btn" aria-pressed="true">原文</button>
        <button type="button" id="learn" class="switch-btn" aria-pressed="false">学习视图</button>
      </div>
      <button class="secondary full" id="clearCache" type="button">清除本页缓存</button>
      <p class="status" id="message"></p>
      <div class="card">
        <div class="host" id="host">当前站点</div>
        <label class="choice"><input type="checkbox" id="siteEnabled" checked /> 在此站点启用</label>
        <label class="choice"><input type="checkbox" id="autoLearn" disabled /> 默认学习视图</label>
      </div>
      <div class="card">
        <label>难度（只改熟词门槛）</label>
        <div class="row">
          <label class="choice"><input type="radio" name="difficulty" value="easy" /> 更易</label>
          <label class="choice"><input type="radio" name="difficulty" value="default" checked /> 默认</label>
          <label class="choice"><input type="radio" name="difficulty" value="hard" /> 更难</label>
        </div>
        <p class="hint">更易：中文更多。更难：英文更多。句子不被改写。</p>
      </div>
      <div class="card" id="setupCard">
        <p class="status" id="setupStatus">正在读取设置…</p>
      </div>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
